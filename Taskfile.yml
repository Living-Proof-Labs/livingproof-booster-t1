# SPDX-License-Identifier: Apache-2.0
version: '3'
vars:
  VERIFIER_COMMIT:
    sh: python3 -c 'import json; print(json.load(open("verification.lock.json"))["releases"]["verifier"]["commit"])'
  CONFIGURATION: '{{.CONFIGURATION | default "stock"}}'
env:
  MUJOCO_GL: osmesa
  PYOPENGL_PLATFORM: osmesa
tasks:
  profile:measure:
    desc: Measure robot width, length, height and mass from the pinned model (robot.json dimensions)
    cmds: [uv run python -m lpl_t1.measure]
  reference:playground:
    desc: Runner vs play_t1_joystick.py's loop (mujoco_playground 12ad7f3), 500 ticks
    cmds: [uv run python -m lpl_t1.playground_reference]
  profile:stand:playground:
    desc: Zero-command standing trunk height in play_t1_joystick.py's loop
    cmds: [uv run python -m lpl_t1.playground_reference --stand]
  profile:stand:
    desc: Zero-command standing trunk height in the publisher's play_mujoco.py loop
    cmds: [uv run python -m lpl_t1.publisher stand]
  reference:
    desc: Tick-by-tick match against booster_gym play_mujoco.py (fresh sensor reads, T1.pt as the actor); exits 1 on FAIL
    cmds: [uv run python -m lpl_t1.reference --ticks 500]
  repin:
    desc: "Repin release refs to real tags (lock has runner v2.0.3, verifier v1.16.1, reporter v3.3.1): task repin -- runner=vX.Y.Z"
    cmds: ['uvx --from git+https://github.com/Living-Proof-Labs/capability-verifier@{{.VERIFIER_COMMIT}} python -m capability_verifier.repin --root . {{.CLI_ARGS}}']
  repin:check:
    desc: Fail while verification.lock.json has PENDING_RELEASE refs or the runner is not on its locked tag
    cmds: ['uvx --from git+https://github.com/Living-Proof-Labs/capability-verifier@{{.VERIFIER_COMMIT}} python -m capability_verifier.repin --root . --check']
