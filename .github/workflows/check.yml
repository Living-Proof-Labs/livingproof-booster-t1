# SPDX-License-Identifier: Apache-2.0
# Lint, profile validation and tests on every pull request (any base branch, so stacked
# PRs are checked) and on pushes to main. The verification chain lives in verify.yml.
name: Check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      MUJOCO_GL: osmesa
      PYOPENGL_PLATFORM: osmesa
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e
        with:
          version: '3.54.0'
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libosmesa6
      - run: python3 -m pip install --user uv==0.13.6
      - run: task setup
      - run: task check
      - run: task test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        with:
          name: tests
          path: artifacts/tests.xml
          retention-days: 14
