[project]
name = "livingproof-booster-t1"
version = "0.1.0"
description = "Booster T1 robot package: pinned model, published controllers and the simulator adapter"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "mujoco==3.17.0",
    "numpy>=1.26",
    "pyyaml>=6",
    "imageio[ffmpeg]>=2.34",
    "livingproof-sim-mujoco[torch,media]",
    "jsonschema>=4.26.0",
    "referencing>=0.37.0",
]

[dependency-groups]
dev = ["pytest==8.4.2", "ruff==0.14.2"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lpl_t1"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
# The simulator library this adapter imports, pinned to released tag v2.0.3.
livingproof-sim-mujoco = { git = "https://github.com/Living-Proof-Labs/livingproof-sim-mujoco.git", tag = "v2.1.1" }

[tool.pytest.ini_options]
addopts = "-ra"

[tool.ruff]
line-length = 100

[tool.livingproof]
# Callers pass this object to the simulator. This package does not select a world or a scenario.
adapter = "lpl_t1.adapter:ROBOT"
